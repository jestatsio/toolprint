name: "toolprint scan"
description: "Scan MCP servers and skill bundles for tool poisoning, secret leaks, and silent rug-pulls; enforce the committed toolprint.lock."
branding:
  icon: shield
  color: purple

inputs:
  target:
    description: "MCP config path, http(s) URL, npx:<package>, or command. Optional if a config is auto-discovered or --config is set."
    required: false
    default: ""
  config:
    description: "Path to an MCP client config file (Claude Desktop / VS Code / Cursor)."
    required: false
    default: ""
  skills:
    description: "Scan SKILL.md bundles instead of an MCP server. Pass a directory, or `true` for the default skill roots."
    required: false
    default: ""
  baseline:
    description: "Path to a prior --json report. Shows what is new/resolved since then."
    required: false
    default: ""
  fail-on-new:
    description: "With `baseline`, fail only on findings that are new since it. Pre-existing findings still report."
    required: false
    default: "false"
  ignore-file:
    description: "Reviewed false positives to exclude from the failure decision (default: toolprint.ignore.json)."
    required: false
    default: ""
  fail-on:
    description: "Minimum severity that fails the build: info|low|medium|high|critical."
    required: false
    default: "high"
  lockfile:
    description: "Path to the toolprint.lock to enforce."
    required: false
    default: ""
  sarif-file:
    description: "If set, write SARIF 2.1.0 results to this path for github/codeql-action/upload-sarif. In SARIF mode findings do not fail the job (they become code-scanning alerts); operational errors still do. Upload with `if: always()`."
    required: false
    default: ""
  version:
    description: "toolprint version to run (npm dist-tag or exact version)."
    required: false
    default: "latest"
  comment-on-pr:
    description: "On a pull_request event (non-SARIF mode), upsert a sticky comment summarizing the scan. Requires `pull-requests: write` permission. Has no effect when sarif-file is set."
    required: false
    default: "false"
  github-token:
    description: "Token used to post the PR comment. Defaults to the workflow token."
    required: false
    default: ${{ github.token }}

runs:
  using: "composite"
  steps:
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: "20"
    - name: Run toolprint scan
      shell: bash
      # Inputs are passed via env (never spliced into the script body) so a value
      # containing shell metacharacters can't break out of the command.
      env:
        INPUT_TARGET: ${{ inputs.target }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_SKILLS: ${{ inputs.skills }}
        INPUT_BASELINE: ${{ inputs.baseline }}
        INPUT_FAIL_ON_NEW: ${{ inputs.fail-on-new }}
        INPUT_IGNORE_FILE: ${{ inputs.ignore-file }}
        INPUT_LOCKFILE: ${{ inputs.lockfile }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_SARIF_FILE: ${{ inputs.sarif-file }}
        INPUT_COMMENT_ON_PR: ${{ inputs.comment-on-pr }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        CMD=(npx --yes "toolprint@${INPUT_VERSION}" scan)
        if [ -n "$INPUT_TARGET" ]; then CMD+=("$INPUT_TARGET"); fi
        if [ -n "$INPUT_CONFIG" ]; then CMD+=(--config "$INPUT_CONFIG"); fi
        if [ "$INPUT_SKILLS" = "true" ]; then
          CMD+=(--skills)
        elif [ -n "$INPUT_SKILLS" ]; then
          CMD+=(--skills "$INPUT_SKILLS")
        fi
        if [ -n "$INPUT_BASELINE" ]; then CMD+=(--baseline "$INPUT_BASELINE"); fi
        if [ "$INPUT_FAIL_ON_NEW" = "true" ]; then CMD+=(--fail-on-new); fi
        if [ -n "$INPUT_IGNORE_FILE" ]; then CMD+=(--ignore-file "$INPUT_IGNORE_FILE"); fi
        if [ -n "$INPUT_LOCKFILE" ]; then CMD+=(--lockfile "$INPUT_LOCKFILE"); fi
        CMD+=(--fail-on "$INPUT_FAIL_ON")
        if [ -n "$INPUT_SARIF_FILE" ]; then
          CMD+=(--sarif)
          echo "+ ${CMD[*]} > $INPUT_SARIF_FILE"
          set +e; "${CMD[@]}" > "$INPUT_SARIF_FILE"; code=$?; set -e
          echo "toolprint exit: $code (SARIF written to $INPUT_SARIF_FILE)"
          # Surface findings as code-scanning alerts rather than failing here;
          # still fail on an operational error (couldn't connect/parse).
          if [ "$code" -eq 1 ]; then exit 1; fi
        elif [ "$INPUT_COMMENT_ON_PR" = "true" ]; then
          # Run once in JSON mode: the report drives the sticky PR comment and is
          # echoed to the log. The scan's exit code still gates the job.
          REPORT="$(mktemp)"
          echo "+ ${CMD[*]} --json > \$REPORT"
          set +e; "${CMD[@]}" --json > "$REPORT"; code=$?; set -e
          cat "$REPORT"
          node "$GITHUB_ACTION_PATH/action/pr-comment.mjs" "$REPORT" || true
          exit "$code"
        else
          CMD+=(--no-color)
          echo "+ ${CMD[*]}"
          "${CMD[@]}"
        fi
