name: Publish to npm

# Publishes toolprint to npm via OIDC trusted publishing — no NPM_TOKEN to leak
# or rotate, and provenance (a signed supply-chain attestation) is automatic.
# Fitting for a supply-chain trust tool. `prepublishOnly` re-runs typecheck +
# tests + build, so a release can never ship broken code.
#
# One-time setup (trusted publishing needs the package to already exist):
#   1. Bootstrap the first publish once (e.g. `npm publish` locally).
#   2. On npmjs.com → the toolprint package → Settings → Trusted Publisher, add
#      this repo and workflow filename (release.yml), allowed action "npm publish".
#   3. Every release after publishes here with no token.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing (provenance is automatic)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"
      # Trusted publishing requires npm >= 11.5.1; Node bundles an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm publish
